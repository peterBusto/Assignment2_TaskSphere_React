name: React Build and Test

on:
  push:
    branches: [main, 3-as-a-develper-i-want-to-have-github-action-for-react-build-and-test-so-that-i-can-see-what-happen-on-server]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./tasksphere

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t tasksphere-frontend .

      - name: Run tests in container
        run: docker run --rm tasksphere-frontend npm test -- --watchAll=false --coverage
