version: "3.9"

services:
  frontend:
    build: .
    container_name: assignment2_tasksphere_react
    command: npm start
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    stdin_open: true
    tty: true

  backend:
    build:
      context: ../../../DjangoProject1/Assignment2_TaskSphere_Django
    container_name: assignment2_tasksphere_django
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../../../DjangoProject1/Assignment2_TaskSphere_Django:/app
    ports:
      - "8000:8000"
    env_file:
      - ../../../DjangoProject1/Assignment2_TaskSphere_Django/.env